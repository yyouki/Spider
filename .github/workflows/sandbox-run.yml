name: Run isolated space sandbox task
run-name: space-sandbox-${{ inputs.task_id }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Internal task ID
        required: true
        type: string
      language:
        description: Runtime
        required: true
        type: choice
        options:
          - python
          - javascript
      task_key:
        description: One-time task encryption key
        required: true
        type: string
      source_encrypted:
        description: AES-GCM encrypted source from the authenticated Space Worker
        required: true
        type: string
      timeout_seconds:
        description: Maximum execution time (1-30 seconds)
        required: true
        type: string
        default: "10"

permissions:
  contents: read

jobs:
  execute:
    name: Execute bounded offline code
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check out trusted sandbox launcher
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Run code in a restricted ephemeral container
        env:
          TASK_ID: ${{ inputs.task_id }}
          LANGUAGE: ${{ inputs.language }}
          TASK_KEY: ${{ inputs.task_key }}
          SOURCE_ENCRYPTED: ${{ inputs.source_encrypted }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: node scripts/run-sandbox-task.mjs

      - name: Upload encrypted bounded task result
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: space-result-${{ inputs.task_id }}
          path: ${{ runner.temp }}/space-sandbox-${{ inputs.task_id }}/result.bin
          if-no-files-found: error
          retention-days: 1