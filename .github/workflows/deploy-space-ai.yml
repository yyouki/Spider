name: Deploy space AI to Cloudflare Free

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type DEPLOY to authorize a production deployment from main
        required: true
        type: string

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_production == 'DEPLOY' }}
    name: Deploy Worker and dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: production
    concurrency:
      group: space-ai-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/space-ai
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify production environment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPACE_OAUTH_CLIENT_ID: ${{ secrets.SPACE_OAUTH_CLIENT_ID }}
          SPACE_OAUTH_CLIENT_SECRET: ${{ secrets.SPACE_OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SPACE_ACTIONS_TOKEN: ${{ secrets.SPACE_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$SPACE_OAUTH_CLIENT_ID"
          test -n "$SPACE_OAUTH_CLIENT_SECRET"
          test -n "$SESSION_SECRET"
          test -n "$SPACE_ACTIONS_TOKEN"
          node -e "if ((process.env.SESSION_SECRET || '').length < 32) process.exit(1)"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and run all tests
        run: npm run check
      - name: Create build-only placeholder secrets
        run: |
          cat > .dev.vars <<'EOF'
          GITHUB_OAUTH_CLIENT_ID=ci-placeholder
          GITHUB_OAUTH_CLIENT_SECRET=ci-placeholder
          SESSION_SECRET=ci-only-session-placeholder-not-valid-for-production
          GITHUB_ACTIONS_TOKEN=ci-placeholder
          EOF
      - name: Build the Worker and dashboard
        run: npm run build
      - name: Remove build-only placeholder secrets
        if: always()
        run: rm -f .dev.vars
      - name: Create encrypted Worker secrets upload file
        shell: bash
        env:
          SPACE_OAUTH_CLIENT_ID: ${{ secrets.SPACE_OAUTH_CLIENT_ID }}
          SPACE_OAUTH_CLIENT_SECRET: ${{ secrets.SPACE_OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SPACE_ACTIONS_TOKEN: ${{ secrets.SPACE_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const values = {
            GITHUB_OAUTH_CLIENT_ID: process.env.SPACE_OAUTH_CLIENT_ID,
            GITHUB_OAUTH_CLIENT_SECRET: process.env.SPACE_OAUTH_CLIENT_SECRET,
            SESSION_SECRET: process.env.SESSION_SECRET,
            GITHUB_ACTIONS_TOKEN: process.env.SPACE_ACTIONS_TOKEN
          };
          if (Object.values(values).some((value) => !value)) {
            throw new Error('One or more required Worker secrets are missing.');
          }
          if (values.SESSION_SECRET.length < 32) throw new Error('SESSION_SECRET is too short.');
          writeFileSync('.cloudflare-secrets.json', JSON.stringify(values), { mode: 0o600 });
          NODE
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --secrets-file .cloudflare-secrets.json
      - name: Remove temporary secret file
        if: always()
        shell: bash
        run: rm -f .cloudflare-secrets.json
