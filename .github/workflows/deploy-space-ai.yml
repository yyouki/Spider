name: Deploy space AI to Cloudflare Free

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type DEPLOY to authorize a production deployment from main
        required: true
        type: string

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_production == 'DEPLOY' }}
    name: Deploy Worker and dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: production
    concurrency:
      group: space-ai-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/space-ai
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production environment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GITHUB_ACTIONS_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$GITHUB_OAUTH_CLIENT_ID"
          test -n "$GITHUB_OAUTH_CLIENT_SECRET"
          test -n "$SESSION_SECRET"
          test -n "$GITHUB_ACTIONS_TOKEN"
          node -e "if ((process.env.SESSION_SECRET || '').length < 32) process.exit(1)"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and run all tests
        run: npm run check
      - name: Build the Worker and dashboard
        run: npm run build
      - name: Create encrypted Worker secrets upload file
        shell: bash
        env:
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GITHUB_ACTIONS_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const names = [
            'GITHUB_OAUTH_CLIENT_ID',
            'GITHUB_OAUTH_CLIENT_SECRET',
            'SESSION_SECRET',
            'GITHUB_ACTIONS_TOKEN'
          ];
          const values = Object.fromEntries(names.map((name) => [name, process.env[name]]));
          if (values.SESSION_SECRET.length < 32) throw new Error('SESSION_SECRET is too short.');
          writeFileSync('.cloudflare-secrets.json', JSON.stringify(values), { mode: 0o600 });
          NODE
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --secrets-file .cloudflare-secrets.json
      - name: Remove temporary secret file
        if: always()
        shell: bash
        run: rm -f .cloudflare-secrets.json
