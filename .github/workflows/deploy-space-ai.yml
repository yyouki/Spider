name: Deploy space AI to Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type DEPLOY to authorize a production deployment from main
        required: true
        type: string

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_production == 'DEPLOY' }}
    name: Deploy Worker and Container image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    environment: production
    concurrency:
      group: space-ai-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/space-ai
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production environment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ACCESS_ALLOWED_EMAIL: ${{ secrets.ACCESS_ALLOWED_EMAIL }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ACCESS_TEAM_DOMAIN ACCESS_AUD ACCESS_ALLOWED_EMAIL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required production environment secret: ${name}"
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and run all tests
        run: npm run check
      - name: Build the Worker and dashboard
        run: npm run build
      - name: Create an ephemeral secrets upload file
        shell: bash
        env:
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ACCESS_ALLOWED_EMAIL: ${{ secrets.ACCESS_ALLOWED_EMAIL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const names = ['ACCESS_TEAM_DOMAIN', 'ACCESS_AUD', 'ACCESS_ALLOWED_EMAIL'];
          const values = Object.fromEntries(names.map((name) => [name, process.env[name]]));
          if (!values.ACCESS_TEAM_DOMAIN.startsWith('https://')) {
            throw new Error('ACCESS_TEAM_DOMAIN must use HTTPS.');
          }
          writeFileSync('.cloudflare-secrets.json', JSON.stringify(values), { mode: 0o600 });
          NODE
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --secrets-file .cloudflare-secrets.json
      - name: Remove ephemeral secrets file
        if: always()
        shell: bash
        run: rm -f .cloudflare-secrets.json
