name: Check space AI MVP

on:
  pull_request:
    paths:
      - "apps/space-ai/**"
      - "scripts/sandbox-*.mjs"
      - ".github/workflows/space-ai-check.yml"
      - ".github/workflows/sandbox-run.yml"
      - "README.md"
      - "docs/**"
  push:
    branches:
      - main
      - feature/free-tier-deploy-and-sandbox
    paths:
      - "apps/space-ai/**"
      - "scripts/sandbox-*.mjs"
      - ".github/workflows/space-ai-check.yml"
      - ".github/workflows/sandbox-run.yml"
      - "README.md"
      - "docs/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/space-ai
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check, test, and generate Cloudflare bindings
        run: npm run check
      - name: Build the Worker and dashboard
        run: npm run build
