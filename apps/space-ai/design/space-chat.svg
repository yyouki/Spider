<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" width="1440" height="1000" font-family='Inter,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14" fill="#1C1D1F" xml:space="preserve" role="img" aria-label="Space main AI chat, light theme" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Space - Main AI Chat (light theme)</title>
<defs>
<style>
.mono{font-family:"JetBrains Mono",Menlo,Consolas,monospace;font-size:13px}
.m{fill:#6A6D72}
.sm{font-size:12px}
.b{font-weight:600}
