<use href="#i-plus" x="30" y="78" width="20" height="20" color="#FAFAF9"/>
<text x="58" y="93" fill="#FAFAF9" font-weight="500">New chat</text>
<rect x="206" y="78" width="46" height="20" rx="4" fill="#3A3C40"/>
<text x="229" y="92" font-size="11" fill="#D6D7DA" text-anchor="middle">Ctrl+J</text>
</g>
