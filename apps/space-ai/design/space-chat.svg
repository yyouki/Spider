<rect x="16.5" y="118.5" width="247" height="36" rx="8" fill="#FAFAF9" stroke="#E2E2DF"/>
<use href="#i-search" x="28" y="128" width="16" height="16" color="#6A6D72"/>
<text x="52" y="141" class="m">Search conversations</text>
<text x="252" y="141" class="m sm" text-anchor="end">Ctrl+K</text>
</g>
<g id="history">
<text x="20" y="188" class="m sm b">Today</text>
<rect x="8" y="198" width="264" height="36" rx="8" fill="#E4E4E0"/>
<text x="24" y="221" font-weight="500">Refactor auth middleware</text>
<text x="24" y="257">Explain the event loop</text>
<text x="24" y="293">Write tests for the parser</text>
<text x="20" y="338" class="m sm b">Previous 7 days</text>
<text x="24" y="371">Dockerfile for the Python API</text>
<text x="24" y="407">Billing schema design</text>
<text x="24" y="443">Debug a flaky CI job</text>
</g>
<g id="account">
<line x1="16" y1="884.5" x2="264" y2="884.5" stroke="#E2E2DF"/>
<text x="20" y="912" class="m sm">Monthly usage</text>
<text x="260" y="912" class="m sm" text-anchor="end">62%</text>
<rect x="20" y="920" width="240" height="4" rx="2" fill="#E2E2DF"/>
<rect x="20" y="920" width="149" height="4" rx="2" fill="#2F7D6D"/>
<circle cx="36" cy="960" r="16" fill="#DCEBE6"/>
<text x="36" y="964" text-anchor="middle" font-size="12" font-weight="600" fill="#1F5F52">AR</text>
<text x="62" y="957" font-weight="500">Alex Rivera</text>
<text x="62" y="974" class="m sm">Pro workspace</text>
</g>
</g>
<g id="topbar">
<line x1="281" y1="56.5" x2="1440" y2="56.5" stroke="#E2E2DF"/>
<text x="304" y="34" font-size="15" font-weight="600">Refactor auth middleware</text>
<text x="520" y="34" class="m sm">api-server</text>
<g id="model-selector">
<rect x="1096.5" y="12.5" width="204" height="32" rx="8" fill="#FFFFFF" stroke="#D6D6D2"/>
<circle cx="1114" cy="28.5" r="4" fill="#2F7D6D"/>
<text x="1126" y="33" font-weight="500">Space Pro</text>
<text x="1202" y="33" class="m sm">Balanced</text>
<use href="#i-chev" x="1276" y="20" width="16" height="16" color="#6A6D72"/>
</g>
