<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" width="1440" height="1000" font-family='Inter,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14" fill="#1C1D1F" xml:space="preserve" role="img" aria-label="Space settings, appearance page, light theme" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Space - Settings (light theme)</title>
<defs>
<style>
.mono{font-family:"JetBrains Mono",Menlo,Consolas,monospace;font-size:13px}
.m{fill:#6A6D72}
.sm{font-size:12px}
.b{font-weight:600}
.c{text-anchor:middle}
.dv{stroke:#E2E2DF}
.bd{fill:#FFFFFF;stroke:#D6D6D2}
.off{fill:#CFCFCB}
.on{fill:#2F7D6D}
.k{fill:#A04A2E}
.s{fill:#2F7D6D}
.f{fill:#2D5E9E}
.ic{fill:none;stroke:#6A6D72;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
</style>
<filter id="toast-shadow" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/></filter>
</defs>
<rect width="1440" height="1000" fill="#FAFAF9"/>
<g id="settings-nav">
<rect width="280" height="1000" fill="#F1F1EF"/>
<line class="dv" x1="280.5" y1="0" x2="280.5" y2="1000"/>
<path class="ic" transform="translate(16 18)" d="M15 6l-6 6 6 6"/>
<text x="44" y="35" class="m">Back to Space</text>
<text x="20" y="84" font-size="18" font-weight="600">Settings</text>
<text x="20" y="130" class="m sm b">Account</text>
<text x="24" y="165">Profile</text>
<text x="20" y="214" class="m sm b">Preferences</text>
<rect x="8" y="226" width="264" height="36" rx="8" fill="#E4E4E0"/>
<text x="24" y="249" font-weight="500">Appearance</text>
<text x="24" y="285">Editor</text>
<text x="24" y="321">Keyboard shortcuts</text>
<text x="24" y="357">AI preferences</text>
<text x="20" y="406" class="m sm b">Workspace</text>
<text x="24" y="441">Configuration</text>
<text x="24" y="477">Privacy and security</text>
</g>
<g id="page-header">
<text x="480" y="96" font-size="24" font-weight="600">Appearance</text>
<text x="480" y="120" class="m">Choose how Space looks on this device.</text>
</g>
<g id="theme-selection">
<text x="480" y="172" class="b">Theme</text>
<text x="480" y="192" class="m sm">Applies to the app, the editor, and the terminal.</text>
<g id="theme-light">
<rect x="480" y="208" width="240" height="150" rx="10" fill="#FFFFFF" stroke="#2F7D6D" stroke-width="2"/>
<rect x="492" y="220" width="216" height="92" rx="6" fill="#FAFAF9" stroke="#E2E2DF"/>
<path d="M498 220h48v92h-48a6 6 0 0 1-6-6v-80a6 6 0 0 1 6-6z" fill="#F1F1EF"/>
<rect x="560" y="236" width="120" height="8" rx="4" fill="#E2E2DF"/>
<rect x="560" y="254" width="90" height="8" rx="4" fill="#E2E2DF"/>
<rect x="560" y="278" width="136" height="20" rx="6" fill="#DCEBE6"/>
<circle cx="502" cy="338" r="7" fill="#2F7D6D"/>
<circle cx="502" cy="338" r="2.5" fill="#FFFFFF"/>
<text x="518" y="343" font-weight="500">Light</text>
</g>
<g id="theme-dark">
<rect x="740" y="208" width="240" height="150" rx="10" fill="#FFFFFF" stroke="#E2E2DF"/>
<rect x="752" y="220" width="216" height="92" rx="6" fill="#1B1C1F"/>
<path d="M758 220h48v92h-48a6 6 0 0 1-6-6v-80a6 6 0 0 1 6-6z" fill="#17181B"/>
<rect x="820" y="236" width="120" height="8" rx="4" fill="#2A2C31"/>
<rect x="820" y="254" width="90" height="8" rx="4" fill="#2A2C31"/>
<rect x="820" y="278" width="136" height="20" rx="6" fill="#1F4A41"/>
<circle cx="762" cy="338" r="7" fill="none" stroke="#B8B8B4" stroke-width="1.5"/>
<text x="778" y="343" font-weight="500">Dark</text>
</g>
<g id="theme-system">
<rect x="1000" y="208" width="240" height="150" rx="10" fill="#FFFFFF" stroke="#E2E2DF"/>
<path d="M1018 220h102v92h-102a6 6 0 0 1-6-6v-80a6 6 0 0 1 6-6z" fill="#FAFAF9"/>
<path d="M1120 220h86a6 6 0 0 1 6 6v80a6 6 0 0 1-6 6h-86z" fill="#1B1C1F"/>
<rect x="1012" y="220" width="36" height="92" fill="#F1F1EF" opacity="0.9"/>
<rect x="1060" y="236" width="52" height="8" rx="4" fill="#E2E2DF"/>
<rect x="1130" y="236" width="60" height="8" rx="4" fill="#2A2C31"/>
<rect x="1060" y="278" width="52" height="20" rx="6" fill="#DCEBE6"/>
<rect x="1130" y="278" width="66" height="20" rx="6" fill="#1F4A41"/>
<circle cx="1022" cy="338" r="7" fill="none" stroke="#B8B8B4" stroke-width="1.5"/>
<text x="1038" y="343" font-weight="500">System</text>
</g>
</g>
<line class="dv" x1="480" y1="382" x2="1240" y2="382"/>
<g id="interface-settings">
<text x="480" y="412" class="b">Interface</text>
<path class="dv" d="M480 492h760M480 556h760M480 620h760M480 684h760"/>
<text x="480" y="456" font-weight="500">Density</text>
<text x="480" y="474" class="m sm">Controls spacing in lists and panels.</text>
<rect class="bd" x="1020" y="442" width="220" height="36" rx="8"/>
<rect x="1024" y="446" width="104" height="28" rx="6" fill="#1C1D1F"/>
<text x="1076" y="464" class="sm c" font-weight="500" fill="#FAFAF9">Comfortable</text>
<text x="1184" y="464" class="sm c" font-weight="500">Compact</text>
<text x="480" y="520" font-weight="500">Reduce motion</text>
<text x="480" y="538" class="m sm">Turns off transitions and streaming animations.</text>
<rect class="off" x="1200" y="512" width="40" height="24" rx="12"/>
<circle cx="1212" cy="524" r="9" fill="#FFFFFF"/>
<text x="480" y="584" font-weight="500">Code font</text>
<text x="480" y="602" class="m sm">Used in the editor, terminal, and code blocks.</text>
<rect class="bd" x="1040" y="570" width="200" height="36" rx="8"/>
<text x="1054" y="593">JetBrains Mono</text>
<path class="ic" transform="translate(1212 576)" d="M6 9l6 6 6-6"/>
<text x="480" y="648" font-weight="500">Line numbers</text>
<text x="480" y="666" class="m sm">Show them in the editor and in code blocks.</text>
<rect class="on" x="1200" y="640" width="40" height="24" rx="12"/>
<circle cx="1228" cy="652" r="9" fill="#FFFFFF"/>
</g>
<g id="code-preview">
<text x="480" y="718" class="b">Preview</text>
<rect x="480" y="732" width="760" height="104" rx="8" fill="#F5F5F3" stroke="#E2E2DF"/>
<text class="mono m" text-anchor="end"><tspan x="508" y="762">1</tspan><tspan x="508" y="784">2</tspan><tspan x="508" y="806">3</tspan></text>
<text class="mono" x="524" y="762"><tspan class="k">export function</tspan> <tspan class="f">greet</tspan>(name: string) {</text>
<text class="mono" x="524" y="784">  <tspan class="k">return</tspan> <tspan class="s">"Hello, "</tspan> + name;</text>
<text class="mono" x="524" y="806">}</text>
</g>
<g id="toast" filter="url(#toast-shadow)">
<rect x="1000" y="892" width="400" height="56" rx="10" fill="#1C1D1F"/>
<circle cx="1028" cy="920" r="10" fill="#2F7D6D"/>
<path d="M1023 920l3.5 3.5 6-7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1050" y="925" font-weight="500" fill="#FAFAF9">Theme set to Light</text>
<text x="1376" y="925" font-weight="500" fill="#7CC4AE" text-anchor="end">Undo</text>
</g>
</svg>
