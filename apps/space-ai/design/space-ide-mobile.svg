<text class="mono ln"><tspan x="30" y="157">1</tspan><tspan x="30" dy="24">2</tspan><tspan x="30" dy="24">3</tspan><tspan x="30" dy="24">4</tspan><tspan x="30" dy="24">5</tspan><tspan x="30" dy="24">6</tspan><tspan x="30" dy="24">7</tspan><tspan x="30" dy="24">8</tspan><tspan x="30" dy="24">9</tspan><tspan x="30" dy="24">10</tspan><tspan x="30" dy="24">11</tspan><tspan x="30" dy="24">12</tspan><tspan x="30" dy="24" class="cur">13</tspan><tspan x="30" dy="24">14</tspan><tspan x="30" dy="24">15</tspan><tspan x="30" dy="24">16</tspan></text>
<text class="mono">
<tspan x="44" y="157"><tspan class="k">import</tspan> { users } <tspan class="k">from</tspan> <tspan class="s">"../users"</tspan>;</tspan>
<tspan x="44" dy="24"><tspan class="k">import</tspan> { readToken } <tspan class="k">from</tspan> <tspan class="s">"./token"</tspan>;</tspan>
<tspan x="44" dy="48"><tspan class="k">export async function</tspan> <tspan class="f">authenticate</tspan>(</tspan>
<tspan x="44" dy="24">  req: Request,</tspan>
<tspan x="44" dy="24">  res: Response,</tspan>
<tspan x="44" dy="24">  next: NextFunction</tspan>
<tspan x="44" dy="24">) {</tspan>
<tspan x="44" dy="24">  <tspan class="k">const</tspan> token = <tspan class="f">readToken</tspan>(req);</tspan>
<tspan x="44" dy="24">  <tspan class="k">if</tspan> (!token || <tspan class="f">isExpired</tspan>(token)) {</tspan>
<tspan x="44" dy="24">    <tspan class="k">return</tspan> res.<tspan class="f">status</tspan>(401).<tspan class="f">end</tspan>();</tspan>
<tspan x="44" dy="24">  }</tspan>
<tspan x="44" dy="24">  <tspan class="k">const</tspan> user = <tspan class="k">await</tspan> users.<tspan class="f">get</tspan>(token);</tspan>
<tspan x="44" dy="24">  req.user = user;</tspan>
<tspan x="44" dy="24">  <tspan class="f">next</tspan>();</tspan>
<tspan x="44" dy="24">}</tspan>
</text>
